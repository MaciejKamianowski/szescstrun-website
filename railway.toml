[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Array form required by Railway Config as Code.
# Runs after image build, with private network + DATABASE_URL.
# Do NOT use `pnpm exec …` — Corepack may download pnpm from the internet.
preDeployCommand = ["sh ./scripts/run-migrations.sh"]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
