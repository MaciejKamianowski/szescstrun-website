[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# After image build, with Railway private network + DATABASE_URL available.
# Do NOT use `pnpm exec …` here — Corepack may try to download pnpm from the internet.
# Failure of this command must fail the deployment.
preDeployCommand = "sh ./scripts/run-migrations.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
